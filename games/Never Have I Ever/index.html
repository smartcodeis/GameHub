    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .game {
            width: min(92vw, 650px);
            text-align: center;
        }

        .title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.8;
            margin-bottom: 35px;
        }

        .card {
            min-height: 300px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 45px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .statement {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            line-height: 1.3;
            max-width: 550px;
        }

        .counter {
            margin-top: 25px;
            opacity: 0.7;
            font-size: 14px;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 15px 28px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
        }

        button:active {
            transform: scale(0.97);
        }

        .next-btn {
            background: white;
            color: #5d4bb7;
            min-width: 180px;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .animation {
            animation: pop 0.35s ease;
        }

        @keyframes pop {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(15px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 35px 20px;
                min-height: 280px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

        const card = document.getElementById("card");
        const nextBtn = document.getElementById("nextBtn");
        const resetBtn = document.getElementById("resetBtn");

        const STORAGE_KEY = "neverHaveIEverGame";

        let remainingStatements = [];
        let usedCount = 0;

        // Load saved game
        function loadGame() {
            const savedGame = localStorage.getItem(STORAGE_KEY);

            if (!savedGame) {
                remainingStatements = [...statements];
                usedCount = 0;
                updateCounter();
                return;
            }

            try {
                const data = JSON.parse(savedGame);

                // التأكد إن البيانات المحفوظة سليمة
                if (
                    Array.isArray(data.remainingStatements) &&
                    typeof data.usedCount === "number"
                ) {
                    remainingStatements = data.remainingStatements;
                    usedCount = data.usedCount;
                } else {
                    resetGame(false);
                    return;
                }

                updateCounter();

                if (usedCount === 0) {
                    statementEl.textContent = "Press the button to start!";
                } else if (remainingStatements.length === 0) {
                    statementEl.textContent = "You've seen all the statements! 🎉";
                    disableNextButton();
                } else if (data.currentStatement) {
                    statementEl.textContent = data.currentStatement;
                }

            } catch (error) {
                console.error("Error loading game:", error);
                resetGame(false);
            }
        }

        // Save game
        function saveGame(currentStatement = null) {
            const gameData = {
                remainingStatements,
                usedCount,
                currentStatement
            };

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(gameData)
            );
        }

        // Update counter
        function updateCounter() {
            counterEl.textContent =
                `${usedCount} / ${statements.length}`;
        }

        // Show random statement
        function showRandomStatement() {

            if (remainingStatements.length === 0) {
                statementEl.textContent =
                    "You've seen all the statements! 🎉";

                counterEl.textContent =
                    `${statements.length} / ${statements.length}`;

                disableNextButton();

                saveGame(statementEl.textContent);

                return;
            }

            const randomIndex = Math.floor(
                Math.random() * remainingStatements.length
            );

            const selectedStatement =
                remainingStatements.splice(randomIndex, 1)[0];

            usedCount++;

            // Restart animation
            statementEl.classList.remove("animation");
            void statementEl.offsetWidth;
            statementEl.classList.add("animation");

            statementEl.textContent = selectedStatement;

            updateCounter();

            // Save after every question
            saveGame(selectedStatement);

            // Disable button when all questions are used
            if (remainingStatements.length === 0) {
                disableNextButton();
            }
        }

        // Disable next button
        function disableNextButton() {
            nextBtn.disabled = true;
            nextBtn.style.opacity = "0.5";
            nextBtn.style.cursor = "not-allowed";
        }

        // Enable next button
        function enableNextButton() {
            nextBtn.disabled = false;
            nextBtn.style.opacity = "1";
            nextBtn.style.cursor = "pointer";
        }

        // Reset game
        function resetGame(save = true) {

            remainingStatements = [...statements];
            usedCount = 0;

            statementEl.textContent =
                "Press the button to start!";

            updateCounter();

            enableNextButton();

            if (save) {
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        nextBtn.addEventListener(
            "click",
            showRandomStatement
        );

        resetBtn.addEventListener(
            "click",
            resetGame
        );

        // Start
        loadGame();
    </script>
