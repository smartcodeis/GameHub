<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This or That</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: min(950px, 100%);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .stat span {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 7px;
        }

        .stat strong {
            font-size: 1.6rem;
        }

        .question {
            text-align: center;
            margin-bottom: 20px;
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .choice {
            min-height: 260px;
            border: 2px solid #334155;
            background: #1e293b;
            border-radius: 24px;
            color: white;
            cursor: pointer;
            padding: 30px;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .choice:hover {
            transform: translateY(-7px);
            border-color: #60a5fa;
            background: #24344d;
        }

        .choice.selected {
            transform: scale(1.03);
            border-color: #22c55e;
            background: #14532d;
        }

        .choice-icon {
            font-size: 4.5rem;
        }

        .choice-name {
            font-size: clamp(1.3rem, 4vw, 2rem);
            font-weight: bold;
            text-align: center;
        }

        .vs {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
        }

        .next-btn {
            display: block;
            margin: 25px auto 0;
            padding: 13px 30px;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .next-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .bottom {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .secondary-btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
        }

        .secondary-btn:hover {
            background: #1e293b;
        }

        .history {
            margin-top: 30px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 20px;
        }

        .history h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .history-item {
            background: #0f172a;
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: #cbd5e1;
        }

        .history-item strong {
            color: #22c55e;
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 15px;
        }

        .progress {
            height: 5px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 25px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #3b82f6;
            transition: width 0.3s ease;
        }

        @media (max-width: 650px) {
            body {
                padding: 15px;
                align-items: flex-start;
                padding-top: 30px;
            }

            .scoreboard {
                gap: 8px;
            }

            .stat {
                padding: 12px 5px;
            }

            .stat strong {
                font-size: 1.3rem;
            }

            .choices {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .choice {
                min-height: 150px;
                padding: 20px;
            }

            .choice-icon {
                font-size: 3rem;
            }

            .vs {
                width: 45px;
                height: 45px;
                margin: -5px auto;
                z-index: 2;
            }

            .history-item {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

        const leftChoice = document.getElementById("leftChoice");
        const rightChoice = document.getElementById("rightChoice");

        const rightName = document.getElementById("rightName");

        const leftIcon = document.getElementById("leftIcon");
        const rightIcon = document.getElementById("rightIcon");

        const nextBtn = document.getElementById("nextBtn");

        const totalChoices = document.getElementById("totalChoices");
        const leftChoices = document.getElementById("leftChoices");
        const rightChoices = document.getElementById("rightChoices");

        const historyList = document.getElementById("historyList");

        const resetBtn = document.getElementById("resetBtn");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");

        const progressBar = document.getElementById("progressBar");
        const pairCounter = document.getElementById("pairCounter");

        let currentPair = [];
        let selectedSide = null;
        let remainingPairs = [...choices];
        const totalPairs = choices.length;
        let gameFinished = false;

        let stats = JSON.parse(
            localStorage.getItem("thisOrThatStats")
        ) || {
            total: 0,
            left: 0,
            right: 0
        };

        let history = JSON.parse(
            localStorage.getItem("thisOrThatHistory")
        ) || [];


        function randomChoice(exclude = []) {

            let available = choices.filter(
                choice => !exclude.includes(choice.name)
            );

            return available[
                Math.floor(Math.random() * available.length)
            ];
        }


        function generatePair() {

            if (remainingPairs.length === 0) {
                finishGame();
                return;
            }

            selectedSide = null;

            leftChoice.classList.remove("selected");
            rightChoice.classList.remove("selected");

            nextBtn.disabled = true;

            const randomIndex = Math.floor(
                Math.random() * remainingPairs.length
            );

            const pair = remainingPairs.splice(randomIndex, 1)[0];

            currentPair = pair;

            const left = pair[0];
            const right = pair[1];

            leftName.textContent = left.name;
            leftIcon.textContent = left.icon;

            rightName.textContent = right.name;
            rightIcon.textContent = right.icon;

            updateProgress();
        }


        function selectChoice(side) {

            selectedSide = side;

            if (side === "left") {
                leftChoice.classList.add("selected");
                rightChoice.classList.remove("selected");
            } else {
                rightChoice.classList.add("selected");
                leftChoice.classList.remove("selected");
            }

            nextBtn.disabled = false;
        }


        function nextRound() {

            // Play Again
            if (gameFinished) {
                resetRounds();
                gameFinished = false;
                return;
            }

            if (selectedSide) {
                if (selectedSide === "left") {
                    stats.left++;
                } else {
                    stats.right++;
                }

                stats.total++;

                history.unshift({
                    left: currentPair[0],
                    right: currentPair[1],
                    selected: selectedSide === "left"
                        ? currentPair[0]
                        : currentPair[1],
                    side: selectedSide,
                    date: new Date().toLocaleTimeString()
                });

                if (history.length > 30) {
                    history.pop();
                }

                saveData();
                updateStats();
                renderHistory();
            }

            // لو مفيش مقارنات متبقية
            if (remainingPairs.length === 0) {
                finishGame();
                return;
            }

            generatePair();
        }



        function updateStats() {

            totalChoices.textContent = stats.total;
            leftChoices.textContent = stats.left;
            rightChoices.textContent = stats.right;
        }

        function resetRounds() {

            remainingPairs = [...choices];
            gameFinished = false;

            leftChoice.style.display = "flex";
            rightChoice.style.display = "flex";

            document.querySelector(".vs").style.display = "flex";
            pairCounter.style.display = "block";

            document.querySelector(".question").textContent =
                "Which one would you choose?";

            nextBtn.textContent = "Next →";
            nextBtn.disabled = true;

            progressBar.style.width = "0%";

            generatePair();
        }

        function updateProgress() {

            const completed = totalPairs - remainingPairs.length;

            const percentage = (completed / totalPairs) * 100;

            progressBar.style.width = percentage + "%";

            if (pairCounter) {
                pairCounter.textContent = `${completed} / ${totalPairs}`;
            }
        }


        function renderHistory() {

            if (history.length === 0) {

                historyList.innerHTML = `
                <div class="empty">
                    No choices yet.
                </div>
            `;

                return;
            }

            historyList.innerHTML = history
                .map(item => `
                <div class="history-item">

                    <span>
                        ${item.left.icon} ${item.left.name}
                        <b>VS</b>
                        ${item.right.icon} ${item.right.name}
                    </span>

                    <strong>
                        ✓ ${item.selected.icon}
                        ${item.selected.name}
                    </strong>

                </div>
            `)
                .join("");
        }


        function saveData() {

            localStorage.setItem(
                "thisOrThatStats",
                JSON.stringify(stats)
            );

            localStorage.setItem(
                "thisOrThatHistory",
                JSON.stringify(history)
            );
        }


        function resetGame() {

            stats = {
                total: 0,
                left: 0,
                right: 0
            };

            history = [];

            remainingPairs = [...choices];
            gameFinished = false;

            saveData();

            updateStats();
            renderHistory();

            leftChoice.style.display = "flex";
            rightChoice.style.display = "flex";

            document.querySelector(".vs").style.display = "flex";
            pairCounter.style.display = "block";

            document.querySelector(".question").textContent =
                "Which one would you choose?";

            nextBtn.textContent = "Next →";

            progressBar.style.width = "0%";

            generatePair();
        }

        function clearHistory() {

            history = [];

            localStorage.setItem(
                "thisOrThatHistory",
                JSON.stringify(history)
            );

            renderHistory();
        }

        function finishGame() {

            gameFinished = true;

            leftChoice.style.display = "none";
            rightChoice.style.display = "none";

            document.querySelector(".vs").style.display = "none";
            pairCounter.style.display = "none";

            document.querySelector(".question").textContent =
                "🎉 You finished all comparisons!";

            nextBtn.textContent = "🔄 Play Again";
            nextBtn.disabled = false;

            progressBar.style.width = "100%";
        }

        leftChoice.addEventListener(
            "click",
            () => selectChoice("left")
        );


        rightChoice.addEventListener(
            "click",
            () => selectChoice("right")
        );


        nextBtn.addEventListener(
            "click",
            nextRound
        );


        resetBtn.addEventListener(
            "click",
            resetGame
        );


        clearHistoryBtn.addEventListener(
            "click",
            clearHistory
        );


        updateStats();
        renderHistory();
        generatePair();

    </script>

</body>

</html>
